<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Purrcast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Design tokens ===================== */
:root {
  --bowl: #E3F2EF;      /* page background: pale mint, like a water bowl */
  --paper: #FFFFFF;     /* cards and stickers */
  --ink: #2E2140;       /* outlines and text: deep plum, never pure black */
  --ink-soft: #6B5C80;  /* secondary text */
  --nose: #FF8FAB;      /* primary buttons: cat-nose pink */
  --butter: #FFD66B;    /* highlights */

  /* status colours (match docs/CONTRACT.md section 4) */
  --good: #7FD8A4;
  --blip: #8EC9FF;
  --vet: #FFC94D;
  --urgent: #FF6B5E;

  --line: 3px;                      /* cartoon outline thickness */
  --pop: 4px 4px 0 var(--ink);      /* hard sticker shadow */
  --pop-sm: 3px 3px 0 var(--ink);
  --font: "Fredoka", "Trebuchet MS", sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bowl);
  color: var(--ink);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  /* tiny paw-print dots in the background */
  background-image: radial-gradient(rgba(46,33,64,.07) 2px, transparent 2.5px);
  background-size: 26px 26px;
}

/* The app lives in one phone-width column, centred on bigger screens */
.app {
  max-width: 420px;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 20px 16px 32px;
  display: flex;
  flex-direction: column;
}
.screen { display: none; flex: 1; flex-direction: column; }
.screen.active { display: flex; }

h1, h2, h3, p { margin: 0; }
h1 { font-size: 40px; font-weight: 700; line-height: 1.05; letter-spacing: -.5px; }
h2 { font-size: 28px; font-weight: 600; line-height: 1.15; }
.lead { color: var(--ink-soft); font-size: 18px; }

/* ===================== Buttons & inputs ===================== */
.btn {
  appearance: none;
  font: 600 19px/1 var(--font);
  color: var(--ink);
  background: var(--nose);
  border: var(--line) solid var(--ink);
  border-radius: 999px;
  padding: 16px 24px;
  box-shadow: var(--pop);
  cursor: pointer;
  width: 100%;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn:disabled { background: #EEE8F2; color: var(--ink-soft); cursor: not-allowed; }
.btn.quiet { background: var(--paper); }
.link-btn {
  appearance: none; background: none; border: 0; padding: 8px;
  font: 500 16px var(--font); color: var(--ink-soft);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
:focus-visible { outline: 3px dashed var(--ink); outline-offset: 4px; }

label.field { display: flex; flex-direction: column; gap: 6px; font-weight: 500; }
.input {
  font: 500 19px var(--font);
  color: var(--ink);
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 18px;
  padding: 13px 16px;
  box-shadow: var(--pop-sm);
  width: 100%;
}
.input::placeholder { color: #B3A8C2; }

/* she / he / they toggle */
.toggle { display: flex; gap: 10px; }
.toggle input { position: absolute; opacity: 0; pointer-events: none; }
.toggle label {
  flex: 1; text-align: center; cursor: pointer;
  font-weight: 600; padding: 11px 0;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 14px;
  box-shadow: var(--pop-sm);
}
.toggle input:checked + label { background: var(--butter); }
.toggle input:focus-visible + label { outline: 3px dashed var(--ink); outline-offset: 3px; }

/* age stepper */
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button {
  width: 48px; height: 48px; border-radius: 50%;
  font: 700 24px/1 var(--font); color: var(--ink);
  background: var(--paper); border: var(--line) solid var(--ink);
  box-shadow: var(--pop-sm); cursor: pointer;
}
.stepper output { font-size: 24px; font-weight: 600; min-width: 90px; text-align: center; }

/* ===================== The cat sticker (the memorable bit) ===================== */
.sticker {
  --ring: var(--paper);
  position: relative;
  width: 200px;
  margin: 0 auto;
  aspect-ratio: 1;
}
.sticker .ears { position: absolute; inset: -34px 0 auto 0; width: 100%; z-index: 0; }
.sticker .ears path { fill: var(--ring); stroke: var(--ink); stroke-width: 6; stroke-linejoin: round; }
.sticker .ears .inner { fill: var(--nose); stroke: none; }
.sticker .face {
  position: relative; z-index: 1;
  width: 100%; height: 100%;
  border-radius: 50%;
  border: var(--line) solid var(--ink);
  background: var(--ring);
  padding: 10px;
  box-shadow: var(--pop);
}
.sticker .face > * {
  width: 100%; height: 100%;
  border-radius: 50%;
  border: var(--line) solid var(--ink);
  object-fit: cover;
  background: var(--paper);
  display: block;
}
.sticker.small { width: 120px; }
.sticker.small .ears { inset: -21px 0 auto 0; }

/* placeholder cartoon cat when there is no photo */
.cartoon-cat { padding: 0; }

/* upload: the sticker itself is the upload button */
.upload { cursor: pointer; display: block; }
.upload input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.upload:focus-within .face { outline: 3px dashed var(--ink); outline-offset: 6px; }
.upload-hint {
  position: absolute; z-index: 2; right: -6px; bottom: 6px;
  background: var(--butter); border: var(--line) solid var(--ink);
  border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 15px;
  box-shadow: var(--pop-sm);
}

/* ===================== Welcome ===================== */
#welcome { justify-content: center; gap: 28px; text-align: center; padding-top: 30px; }
#welcome .sticker { width: 220px; margin-bottom: 8px; }
#welcome h1 { font-size: 52px; }

/* ===================== Add your cat ===================== */
#setup { gap: 22px; }
#setup .sticker { margin: 40px auto 6px; }
.back { align-self: flex-start; }

/* ===================== Home ===================== */
#home { gap: 22px; }
.topbar { display: flex; justify-content: space-between; align-items: center; }
.brand { font-weight: 700; font-size: 22px; }
.who { text-align: center; margin-top: 30px; }
.who .name { font-size: 30px; font-weight: 700; margin-top: 14px; }
.who .age { color: var(--ink-soft); }

/* speech bubble: the cat "says" today's message */
.bubble {
  position: relative;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 26px;
  padding: 18px 20px;
  font-size: 19px;
  font-weight: 500;
  box-shadow: var(--pop);
}
.bubble::before, .bubble::after {
  content: ""; position: absolute; left: 50%;
  border: 14px solid transparent; transform: translateX(-50%);
}
.bubble::before { top: -31px; border-bottom: 17px solid var(--ink); }
.bubble::after  { top: -23px; border-bottom: 15px solid var(--paper); }
.bubble .level {
  display: inline-block; margin-bottom: 8px;
  font-size: 15px; font-weight: 600;
  padding: 3px 12px; border-radius: 999px;
  border: 2.5px solid var(--ink);
  background: var(--ring, var(--good));
}

.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile {
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 20px;
  padding: 10px 4px 8px;
  text-align: center;
  font-size: 14px; font-weight: 600;
  box-shadow: var(--pop-sm);
}
.tile svg { width: 34px; height: 34px; display: block; margin: 0 auto 4px; }
.tile .word { color: var(--ink-soft); font-weight: 500; }
.tile.changed { background: var(--ring); }
.tile.changed .word { color: var(--ink); }

/* ===================== "Right now" mascot card ===================== */
.now {
  display: flex; align-items: center; gap: 14px;
  background: var(--paper);
  border: var(--line) solid var(--ink);
  border-radius: 26px;
  padding: 10px 16px 10px 10px;
  box-shadow: var(--pop-sm);
}
.now .stage {
  flex: none; width: 116px; height: 94px;
  background: var(--bowl); border-radius: 18px;
  border: 2.5px solid var(--ink);
  overflow: hidden;
}
.now .stage svg { width: 100%; height: 100%; display: block; }
.now .what { font-weight: 600; font-size: 18px; line-height: 1.25; }
.now .when { color: var(--ink-soft); font-size: 15px; margin-top: 2px; }

/* Mascot parts: shown/hidden and animated by data-scene on the <svg> */
.m-outline { stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
.mascot .tail, .mascot .head, .mascot .body-g, .mascot .tongue,
.mascot .zz text, .mascot .ripple, .mascot .bits > * { transform-box: fill-box; }
.mascot .tail { transform-origin: 0% 100%; animation: sway 2.2s ease-in-out infinite; }
.mascot .head { transform-origin: 50% 100%; transition: transform .35s; }
.mascot .eyes-closed, .mascot .tongue, .mascot .bowl, .mascot .water, .mascot .kibble,
.mascot .zz, .mascot .box, .mascot .sand { display: none; }

/* drinking: head dips, tongue laps, water ripples */
.mascot[data-scene=drink] :is(.bowl, .water, .tongue) { display: inline; }
.mascot[data-scene=drink] .head { animation: lap .55s ease-in-out infinite alternate; }
.mascot[data-scene=drink] .tongue { transform-origin: 50% 0%; animation: flick .55s ease-in-out infinite alternate; }
.mascot[data-scene=drink] .ripple { transform-origin: center; animation: ripple 1.1s ease-out infinite; }

/* eating: head chomps, kibble hops */
.mascot[data-scene=eat] :is(.bowl, .kibble, .tongue) { display: inline; }
.mascot[data-scene=eat] .bowl path { fill: var(--nose); }
.mascot[data-scene=eat] .head { animation: chomp .3s ease-in-out infinite alternate; }
.mascot[data-scene=eat] .kibble > * { animation: hop .6s ease-out infinite; }
.mascot[data-scene=eat] .kibble > :nth-child(2) { animation-delay: .2s; }
.mascot[data-scene=eat] .kibble > :nth-child(3) { animation-delay: .4s; }

/* sleeping: eyes shut, head droops, chest breathes, Z's float up */
.mascot[data-scene=sleep] .eyes-open { display: none; }
.mascot[data-scene=sleep] :is(.eyes-closed, .zz) { display: inline; }
.mascot[data-scene=sleep] .head { transform: translate(0, 8px) rotate(-12deg); }
.mascot[data-scene=sleep] .tail { animation: none; }
.mascot[data-scene=sleep] .body-g { transform-origin: 50% 100%; animation: breathe 2.6s ease-in-out infinite; }
.mascot[data-scene=sleep] .zz text { animation: zfloat 3s ease-in infinite; opacity: 0; }
.mascot[data-scene=sleep] .zz text:nth-child(2) { animation-delay: 1s; }
.mascot[data-scene=sleep] .zz text:nth-child(3) { animation-delay: 2s; }

/* litter box: sitting in the box, looking around, sand flicks */
.mascot[data-scene=litter] :is(.box, .sand) { display: inline; }
.mascot[data-scene=litter] .head { animation: look 1.6s ease-in-out infinite; }
.mascot[data-scene=litter] .sand > * { animation: hop .7s ease-out infinite; }
.mascot[data-scene=litter] .sand > :nth-child(2) { animation-delay: .25s; }
.mascot[data-scene=litter] .sand > :nth-child(3) { animation-delay: .5s; }

@keyframes sway    { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
@keyframes lap     { from { transform: translateY(13px); } to { transform: translateY(17px); } }
@keyframes flick   { from { transform: scaleY(.4); } to { transform: scaleY(1.2); } }
@keyframes ripple  { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
@keyframes chomp   { from { transform: translateY(10px); } to { transform: translateY(15px) rotate(3deg); } }
@keyframes hop     { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-14px); opacity: 0; } }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.03, 1.06); } }
@keyframes zfloat  { 0% { transform: translate(0, 6px); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(8px, -18px); opacity: 0; } }
@keyframes look    { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }

@media (prefers-reduced-motion: reduce) {
  .mascot *, .mascot .head { animation: none !important; }
  .mascot[data-scene=sleep] .zz text { opacity: 1; }
}

/* demo-only: preview the four states */
.preview { margin-top: auto; padding-top: 18px; text-align: center; }
.preview p { font-size: 14px; color: var(--ink-soft); margin-bottom: 8px; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.chip {
  font: 600 14px var(--font); color: var(--ink);
  border: 2.5px solid var(--ink); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; background: var(--paper);
}
.chip[aria-pressed="true"] { background: var(--c); }

/* ===================== "See more" sheet ===================== */
.scrim {
  position: fixed; inset: 0; background: rgba(46,33,64,.35);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.sheet {
  position: fixed; left: 50%; bottom: 0;
  width: min(420px, 100%);
  transform: translate(-50%, 105%);
  background: var(--paper);
  border: var(--line) solid var(--ink); border-bottom: 0;
  border-radius: 30px 30px 0 0;
  padding: 14px 20px 28px;
  transition: transform .28s cubic-bezier(.2,.9,.3,1.2);
  max-height: 85dvh; overflow-y: auto;
}
.sheet-open .scrim { opacity: 1; pointer-events: auto; }
.sheet-open .sheet { transform: translate(-50%, 0); }
.grabber { width: 54px; height: 6px; border-radius: 9px; background: var(--ink); margin: 0 auto 18px; opacity: .25; }
.sheet h3 { font-size: 18px; font-weight: 600; margin: 18px 0 4px; }
.sheet h3:first-of-type { margin-top: 0; }
.sheet p { color: var(--ink); }
.sheet .call {
  margin-top: 20px; padding: 14px 16px;
  background: var(--bowl); border: 2.5px solid var(--ink); border-radius: 18px;
}
.sheet .btn { margin-top: 22px; }

/* ===================== One bit of motion: the cat blinks ===================== */
.blink { animation: blink 4.5s infinite; transform-origin: center; transform-box: fill-box; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@media (prefers-reduced-motion: reduce) {
  .blink { animation: none; }
  .sheet, .scrim, .btn { transition: none; }
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 1. Welcome ============ -->
  <section class="screen active" id="welcome" aria-labelledby="welcome-title">
    <div class="sticker" style="--ring: var(--butter)">
      <svg class="ears" viewBox="0 0 200 80" aria-hidden="true">
        <path d="M22 78 L38 8 L92 60 Z"/><path class="inner" d="M40 62 L46 30 L72 56 Z"/>
        <path d="M178 78 L162 8 L108 60 Z"/><path class="inner" d="M160 62 L154 30 L128 56 Z"/>
      </svg>
      <div class="face"><svg class="cartoon-cat" data-cat viewBox="0 0 120 120" role="img" aria-label="Cartoon cat"></svg></div>
    </div>
    <h1 id="welcome-title">Purrcast</h1>
    <p class="lead">Small scales under the bowls, litter box and bed. One simple update when your cat's habits change.</p>
    <button class="btn" data-go="setup">Add my cat</button>
  </section>

  <!-- ============ 2. Add your cat ============ -->
  <section class="screen" id="setup" aria-labelledby="setup-title">
    <button class="link-btn back" data-go="welcome">Back</button>
    <h2 id="setup-title">Tell us about your cat</h2>

    <label class="sticker upload" id="photo-picker" style="--ring: var(--butter)">
      <svg class="ears" viewBox="0 0 200 80" aria-hidden="true">
        <path d="M22 78 L38 8 L92 60 Z"/><path class="inner" d="M40 62 L46 30 L72 56 Z"/>
        <path d="M178 78 L162 8 L108 60 Z"/><path class="inner" d="M160 62 L154 30 L128 56 Z"/>
      </svg>
      <div class="face" id="setup-face"><svg class="cartoon-cat" data-cat viewBox="0 0 120 120" aria-hidden="true"></svg></div>
      <span class="upload-hint" id="photo-hint">Add photo</span>
      <input type="file" accept="image/*" id="photo-input" aria-label="Upload a photo of your cat">
    </label>

    <label class="field">Name
      <input class="input" id="cat-name" maxlength="20" placeholder="Luna" autocomplete="off">
    </label>

    <div class="field">
      <span id="age-label">Age</span>
      <div class="stepper" role="group" aria-labelledby="age-label">
        <button type="button" data-age="-1" aria-label="Younger">–</button>
        <output id="cat-age" aria-live="polite">3 years</output>
        <button type="button" data-age="1" aria-label="Older">+</button>
      </div>
    </div>

    <div class="field">
      <span id="sex-label">Your cat is a</span>
      <div class="toggle" role="radiogroup" aria-labelledby="sex-label">
        <input type="radio" name="sex" id="sex-f" value="female" checked><label for="sex-f">Girl</label>
        <input type="radio" name="sex" id="sex-m" value="male"><label for="sex-m">Boy</label>
      </div>
    </div>

    <button class="btn" id="meet-btn" disabled>Add your cat's name</button>
  </section>

  <!-- ============ 3. Home ============ -->
  <section class="screen" id="home" aria-label="Today">
    <div class="topbar">
      <span class="brand">Purrcast</span>
      <button class="link-btn" id="edit-cat">Edit cat</button>
    </div>

    <div class="who">
      <div class="sticker" id="home-sticker">
        <svg class="ears" viewBox="0 0 200 80" aria-hidden="true">
          <path d="M22 78 L38 8 L92 60 Z"/><path class="inner" d="M40 62 L46 30 L72 56 Z"/>
          <path d="M178 78 L162 8 L108 60 Z"/><path class="inner" d="M160 62 L154 30 L128 56 Z"/>
        </svg>
        <div class="face" id="home-face"></div>
      </div>
      <p class="name" id="home-name"></p>
      <p class="age" id="home-age"></p>
    </div>

    <div class="bubble" id="bubble" aria-live="polite">
      <span class="level" id="level"></span>
      <p id="message"></p>
    </div>

    <!-- Right now: the mascot acts out what the cat is doing -->
    <div class="now" aria-live="polite">
      <div class="stage">
        <svg class="mascot" id="mascot" data-scene="idle" viewBox="0 0 160 130" role="img" aria-labelledby="now-what">
          <!-- litter box sits behind the cat -->
          <g class="box"><path class="m-outline" d="M22 96 H138 V126 H22 Z" fill="#FFD66B"/></g>
          <g class="tail"><path d="M108 112 Q140 108 136 74 Q134 62 142 56" fill="none" stroke="#2E2140" stroke-width="10" stroke-linecap="round"/>
            <path d="M108 112 Q140 108 136 74 Q134 62 142 56" fill="none" stroke="#F7B267" stroke-width="5" stroke-linecap="round"/></g>
          <g class="body-g">
            <ellipse class="m-outline" cx="80" cy="102" rx="33" ry="27" fill="#F7B267"/>
            <ellipse cx="80" cy="108" rx="16" ry="14" fill="#FFE3A3"/>
            <ellipse class="m-outline" cx="68" cy="126" rx="9" ry="5" fill="#F7B267" stroke-width="3"/>
            <ellipse class="m-outline" cx="92" cy="126" rx="9" ry="5" fill="#F7B267" stroke-width="3"/>
          </g>
          <g class="head">
            <path class="m-outline" d="M57 46 L58 18 L77 34 Z" fill="#F7B267"/><path d="M61 38 L62 26 L71 34 Z" fill="#FF8FAB"/>
            <path class="m-outline" d="M103 46 L102 18 L83 34 Z" fill="#F7B267"/><path d="M99 38 L98 26 L89 34 Z" fill="#FF8FAB"/>
            <circle class="m-outline" cx="80" cy="58" r="27" fill="#F7B267"/>
            <path d="M70 37 Q74 33 78 37 M82 37 Q86 33 90 37" stroke="#E8964A" stroke-width="3" fill="none" stroke-linecap="round"/>
            <g class="eyes-open blink"><ellipse cx="70" cy="58" rx="4" ry="5.5" fill="#2E2140"/><ellipse cx="90" cy="58" rx="4" ry="5.5" fill="#2E2140"/>
              <circle cx="71.5" cy="56" r="1.5" fill="#fff"/><circle cx="91.5" cy="56" r="1.5" fill="#fff"/></g>
            <g class="eyes-closed"><path d="M65 59 Q70 63 75 59 M85 59 Q90 63 95 59" stroke="#2E2140" stroke-width="3" fill="none" stroke-linecap="round"/></g>
            <ellipse class="tongue" cx="80" cy="74" rx="4" ry="5" fill="#FF8FAB" stroke="#2E2140" stroke-width="2"/>
            <path d="M77 66 L83 66 L80 69 Z" fill="#FF8FAB" stroke="#2E2140" stroke-width="2" stroke-linejoin="round"/>
            <path d="M80 69 Q77 73 73 71 M80 69 Q83 73 87 71" stroke="#2E2140" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <circle cx="63" cy="67" r="4" fill="#FF8FAB" opacity=".5"/><circle cx="97" cy="67" r="4" fill="#FF8FAB" opacity=".5"/>
          </g>
          <!-- bowl in front of the paws (water or food) -->
          <g class="bowl"><path class="m-outline" d="M50 108 H110 L104 128 H56 Z" fill="#8EC9FF"/></g>
          <g class="water"><ellipse cx="80" cy="108" rx="28" ry="4" fill="#CFE8FF" stroke="#2E2140" stroke-width="2.5"/>
            <ellipse class="ripple" cx="80" cy="108" rx="12" ry="2" fill="none" stroke="#fff" stroke-width="2"/></g>
          <g class="kibble bits"><circle cx="70" cy="104" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2"/>
            <circle cx="82" cy="102" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2"/>
            <circle cx="92" cy="104" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2"/></g>
          <!-- litter in front of the cat -->
          <g class="box"><path class="m-outline" d="M22 112 H138 V126 H22 Z" fill="#FFD66B"/>
            <path d="M26 112 Q50 104 80 110 Q110 104 134 112" fill="#F3E6C8" stroke="#2E2140" stroke-width="3"/></g>
          <g class="sand bits"><circle cx="40" cy="104" r="2.5" fill="#E6D3A8"/><circle cx="120" cy="102" r="2.5" fill="#E6D3A8"/><circle cx="50" cy="100" r="2" fill="#E6D3A8"/></g>
          <g class="zz" font-family="Fredoka, sans-serif" font-weight="700" fill="#2E2140">
            <text x="108" y="38" font-size="14">z</text><text x="118" y="28" font-size="17">z</text><text x="130" y="18" font-size="20">Z</text>
          </g>
        </svg>
      </div>
      <div>
        <p class="what" id="now-what"></p>
        <p class="when" id="now-when"></p>
      </div>
    </div>

    <div class="tiles" id="tiles"></div>

    <button class="btn quiet" id="more-btn">See more</button>

    <div class="preview">
      <p>Prototype: preview each status</p>
      <div class="chips" id="chips"></div>
      <p style="margin-top:12px">Prototype: preview what the cat is doing</p>
      <div class="chips" id="activity-chips"></div>
    </div>
  </section>
</div>

<!-- ============ "See more" sheet ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <h3 id="sheet-title">What changed</h3>
  <p id="d-changed"></p>
  <div id="d-check-wrap">
    <h3>Things to check</h3>
    <p id="d-check"></p>
  </div>
  <div class="call">
    <h3>When to contact your vet</h3>
    <p id="d-call"></p>
  </div>
  <button class="btn" id="close-sheet">Close</button>
</div>

<script>
/* ============================================================
   Purrcast UI concept
   - Works with no backend (built-in examples of the 4 statuses).
   - To use the real API, open:  index.html?api=http://localhost:8000
   ============================================================ */

/* ---------- Cartoon cat drawn in SVG (shown before a photo is added) ---------- */
const CAT_SVG = `
  <rect width="120" height="120" fill="#FFE3A3"/>
  <ellipse cx="60" cy="72" rx="44" ry="40" fill="#F7B267" stroke="#2E2140" stroke-width="4"/>
  <path d="M30 50 Q38 44 46 50 M74 50 Q82 44 90 50" stroke="#E8964A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g class="blink">
    <ellipse cx="44" cy="68" rx="6" ry="8" fill="#2E2140"/>
    <ellipse cx="76" cy="68" rx="6" ry="8" fill="#2E2140"/>
    <circle cx="46" cy="65" r="2" fill="#fff"/><circle cx="78" cy="65" r="2" fill="#fff"/>
  </g>
  <path d="M56 80 L64 80 L60 85 Z" fill="#FF8FAB" stroke="#2E2140" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M60 85 Q55 92 49 89 M60 85 Q65 92 71 89" stroke="#2E2140" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="34" cy="82" r="6" fill="#FF8FAB" opacity=".55"/><circle cx="86" cy="82" r="6" fill="#FF8FAB" opacity=".55"/>
  <path d="M18 78 L36 80 M18 88 L36 85 M102 78 L84 80 M102 88 L84 85" stroke="#2E2140" stroke-width="2.5" stroke-linecap="round"/>`;
document.querySelectorAll("[data-cat]").forEach(s => s.innerHTML = CAT_SVG);

/* ---------- Tile icons (simple, hand-drawn style) ---------- */
const ICONS = {
  water: `<svg viewBox="0 0 40 40"><path d="M20 5 C26 14 31 20 31 26 a11 11 0 0 1 -22 0 C9 20 14 14 20 5Z" fill="#8EC9FF" stroke="#2E2140" stroke-width="3" stroke-linejoin="round"/><path d="M15 27 a5 5 0 0 0 5 5" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  food: `<svg viewBox="0 0 40 40"><path d="M5 20 H35 L31 32 H9 Z" fill="#FF8FAB" stroke="#2E2140" stroke-width="3" stroke-linejoin="round"/><circle cx="14" cy="17" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2.5"/><circle cx="21" cy="15" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2.5"/><circle cx="27" cy="17.5" r="3.5" fill="#C98B4E" stroke="#2E2140" stroke-width="2.5"/></svg>`,
  litter: `<svg viewBox="0 0 40 40"><path d="M4 18 H36 V31 a3 3 0 0 1 -3 3 H7 a3 3 0 0 1 -3 -3 Z" fill="#FFD66B" stroke="#2E2140" stroke-width="3" stroke-linejoin="round"/><path d="M9 18 Q14 12 20 15 Q26 11 31 18" fill="#F3E6C8" stroke="#2E2140" stroke-width="3" stroke-linejoin="round"/></svg>`,
  weight: `<svg viewBox="0 0 40 40"><rect x="5" y="9" width="30" height="24" rx="7" fill="#7FD8A4" stroke="#2E2140" stroke-width="3"/><path d="M13 19 a7 7 0 0 1 14 0" fill="#fff" stroke="#2E2140" stroke-width="3"/><path d="M20 19 L23 15" stroke="#2E2140" stroke-width="3" stroke-linecap="round"/></svg>`,
};

const LEVELS = {
  good:   { label: "All good",          color: "var(--good)" },
  blip:   { label: "Minor blip",        color: "var(--blip)" },
  vet:    { label: "Worth a vet visit", color: "var(--vet)" },
  urgent: { label: "Call your vet now", color: "var(--urgent)" },
};

// Which backend demo cat shows each status (docs/CONTRACT.md default cats)
const DEMO_CAT = { good: "mochi", blip: "luna", vet: "tiger", urgent: "oscar" };

/* ---------- Built-in examples (copied from the engine's real output) ----------
   {name}, {she}, {her} are filled in with the owner's cat. */
const EXAMPLES = {
  good: {
    message: "{name}'s patterns have been consistent over the last 24 hours. If you notice any other symptoms, contact your vet.",
    tiles: { water: "steady", food: "steady", litter: "steady", weight: "steady" },
    details: {
      changed: "Eating, drinking, litter use, weight and rest are all consistent with {her} usual patterns.",
      maybe_nothing: "",
      call_if: "Purrcast tracks changes in habits and measurements; it can't detect every illness. If you notice any other symptoms, contact your vet.",
    },
  },
  blip: {
    message: "{name}'s patterns have changed: {she} drank about 41% more than usual yesterday.",
    tiles: { water: "up", food: "steady", litter: "steady", weight: "steady" },
    details: {
      changed: "Water 257 ml yesterday vs {her} usual 182 ml. Everything else is consistent with usual.",
      maybe_nothing: "Is {her} water bowl in a warm spot? Has {her} food changed (dry vs wet)? Has {she} been more active? We'll keep watching over the next 48 hours.",
      call_if: "If you have any concerns, contact your vet.",
    },
  },
  vet: {
    message: "{name}'s patterns have changed: {she} has been drinking more and leaving more in the litter box.",
    tiles: { water: "up", food: "steady", litter: "up", weight: "steady" },
    details: {
      changed: "Drinking more and leaving more in the litter box at the same time. Litter output 166 g yesterday vs {her} usual 124 g.",
      maybe_nothing: "Is {her} water bowl in a warm spot? Has {her} food changed (dry vs wet)? Has {she} been more active?",
      call_if: "This change has lasted long enough that it's worth mentioning to your vet. Contact them sooner if {she} stops eating, hides, vomits, or strains in the litter box.",
    },
  },
  urgent: {
    message: "{name} has visited the litter box 24 times in the last day with very little output. This pattern can need urgent care. Contact your vet or an emergency clinic now.",
    tiles: { water: "steady", food: "steady", litter: "many visits", weight: "steady" },
    details: {
      changed: "24 litter visits in the last day (usually about 5) with very little left behind.",
      maybe_nothing: "",
      call_if: "Contact your vet or an emergency clinic now. Don't wait to see if it passes.",
    },
  },
};

/* ---------- Small helpers ---------- */
const $ = id => document.getElementById(id);
const API = new URLSearchParams(location.search).get("api");   // e.g. http://localhost:8000

// localStorage can be blocked (private mode etc.), so never let it crash the app
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* photo too big or storage blocked: keep it in memory only */ } },
};

let cat = store.get("purrcast-cat") || null;   // { name, age, sex, photo }
let level = "good";
let draft = { age: 3, photo: null };

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("active", s.id === id));
  window.scrollTo(0, 0);
}

function words(c) {
  return c.sex === "male" ? { she: "he", her: "his" } : { she: "she", her: "her" };
}
function fill(text, c) {
  const w = words(c);
  return text.replaceAll("{name}", c.name).replaceAll("{she}", w.she).replaceAll("{her}", w.her);
}
function faceHTML(c) {
  return c && c.photo
    ? `<img src="${c.photo}" alt="${c.name}">`
    : `<svg class="cartoon-cat" viewBox="0 0 120 120" aria-hidden="true">${CAT_SVG}</svg>`;
}

/* ---------- Setup screen ---------- */
function setAge(n) {
  draft.age = Math.min(25, Math.max(0, n));
  $("cat-age").textContent = draft.age === 0 ? "Kitten" : `${draft.age} year${draft.age === 1 ? "" : "s"}`;
}
document.querySelectorAll("[data-age]").forEach(b =>
  b.addEventListener("click", () => setAge(draft.age + Number(b.dataset.age))));

function updateMeetButton() {
  const name = $("cat-name").value.trim();
  $("meet-btn").disabled = !name;
  $("meet-btn").textContent = name ? `Meet ${name}` : "Add your cat's name";
}
$("cat-name").addEventListener("input", updateMeetButton);

// Shrink the photo before saving, so it fits in storage and loads fast
$("photo-input").addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    const size = 360, c = document.createElement("canvas");
    c.width = c.height = size;
    const s = Math.min(img.width, img.height);   // square crop from the centre
    c.getContext("2d").drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
    draft.photo = c.toDataURL("image/jpeg", 0.85);
    $("setup-face").innerHTML = `<img src="${draft.photo}" alt="Your cat">`;
    $("photo-hint").textContent = "Change";
    URL.revokeObjectURL(img.src);
  };
  img.src = URL.createObjectURL(file);
});

$("meet-btn").addEventListener("click", () => {
  cat = {
    name: $("cat-name").value.trim(),
    age: draft.age,
    sex: document.querySelector("input[name=sex]:checked").value,
    photo: draft.photo,
  };
  store.set("purrcast-cat", cat);
  renderHome();
  show("home");
});

$("edit-cat").addEventListener("click", () => {
  $("cat-name").value = cat.name;
  setAge(cat.age);
  document.querySelector(`input[name=sex][value=${cat.sex}]`).checked = true;
  draft.photo = cat.photo;
  $("setup-face").innerHTML = faceHTML(cat);
  $("photo-hint").textContent = cat.photo ? "Change" : "Add photo";
  updateMeetButton();
  $("meet-btn").textContent = "Save";
  show("setup");
});

document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => show(b.dataset.go)));

/* ---------- Home screen ---------- */

// Get today's status: real API if ?api= is set, otherwise the built-in example
async function getStatus(lvl) {
  const ex = EXAMPLES[lvl];
  if (API) {
    try {
      const r = await fetch(`${API}/cats/${DEMO_CAT[lvl]}/status`);
      if (r.ok) {
        const s = await r.json();
        // Swap the demo cat's name for the owner's cat
        const rename = t => (t || "").replaceAll(s.name, cat.name);
        return {
          level: s.level,
          message: rename(s.message),
          tiles: Object.fromEntries(s.tiles.map(t => [t.key, t.label.replace(/^\w+:?\s*/, "")])),
          details: { changed: rename(s.details.changed),
                     maybe_nothing: rename(s.details.maybe_nothing).replace(/^Things to check:\s*/, ""),
                     call_if: rename(s.details.call_if) },
        };
      }
    } catch { /* backend not running: fall back to the example */ }
  }
  return {
    level: lvl,
    message: fill(ex.message, cat),
    tiles: ex.tiles,
    details: Object.fromEntries(Object.entries(ex.details).map(([k, v]) => [k, fill(v, cat)])),
  };
}

let current = null;

async function renderHome() {
  $("home-face").innerHTML = faceHTML(cat);
  $("home-name").textContent = cat.name;
  $("home-age").textContent = cat.age === 0 ? "Kitten" : `${cat.age} year${cat.age === 1 ? "" : "s"} old`;

  const s = await getStatus(level);
  current = s;
  const color = LEVELS[s.level].color;

  // The status colour flows into the sticker ring, ears, bubble badge and changed tiles
  $("home").style.setProperty("--ring", color);
  $("home-sticker").style.setProperty("--ring", color);
  $("level").textContent = LEVELS[s.level].label;
  $("message").textContent = s.message;

  $("tiles").innerHTML = Object.entries(ICONS).map(([key, icon]) => {
    const word = s.tiles[key] || "steady";
    const changed = word !== "steady";
    return `<div class="tile${changed ? " changed" : ""}">${icon}${key[0].toUpperCase() + key.slice(1)}<div class="word">${word}</div></div>`;
  }).join("");

  $("chips").innerHTML = Object.entries(LEVELS).map(([k, v]) =>
    `<button class="chip" style="--c:${v.color}" aria-pressed="${k === level}" data-level="${k}">${v.label}</button>`).join("");
  document.querySelectorAll("[data-level]").forEach(b =>
    b.addEventListener("click", () => { level = b.dataset.level; renderHome(); }));
  renderActivity();
}

/* ---------- "Right now" mascot ----------
   In the real app this comes from the sensors' latest event
   (sensors/output/events.csv: drink, eat, litter_visit, bed_session),
   e.g. through a backend endpoint like GET /cats/{id}/now. */
const ACTIVITIES = {
  idle:   { label: "Relaxing", what: "{name} is relaxing",              when: "Last drink 40 minutes ago" },
  drink:  { label: "Drinking", what: "{name} is having a drink",        when: "Water bowl, just now" },
  eat:    { label: "Eating",   what: "{name} is eating",                when: "Food bowl, just now" },
  sleep:  { label: "Napping",  what: "{name} is napping",               when: "On the bed for 1 h 20 min" },
  litter: { label: "Litter",   what: "{name} is in the litter box",     when: "Third visit today" },
};
let activity = "drink";

function renderActivity() {
  const a = ACTIVITIES[activity];
  $("mascot").dataset.scene = activity;
  $("now-what").textContent = fill(a.what, cat);
  $("now-when").textContent = a.when;
  $("activity-chips").innerHTML = Object.entries(ACTIVITIES).map(([k, v]) =>
    `<button class="chip" style="--c:var(--butter)" aria-pressed="${k === activity}" data-activity="${k}">${v.label}</button>`).join("");
  document.querySelectorAll("[data-activity]").forEach(b =>
    b.addEventListener("click", () => { activity = b.dataset.activity; renderActivity(); }));
}

/* ---------- "See more" sheet ---------- */
function openSheet() {
  const d = current.details;
  $("d-changed").textContent = d.changed;
  $("d-check").textContent = d.maybe_nothing;
  $("d-check-wrap").hidden = !d.maybe_nothing;
  $("d-call").textContent = d.call_if;
  $("sheet").hidden = false;
  requestAnimationFrame(() => document.body.classList.add("sheet-open"));
  $("close-sheet").focus();
}
function closeSheet() {
  document.body.classList.remove("sheet-open");
  setTimeout(() => { $("sheet").hidden = true; $("more-btn").focus(); }, 280);
}
$("more-btn").addEventListener("click", openSheet);
$("close-sheet").addEventListener("click", closeSheet);
$("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });

/* ---------- Start ---------- */
if (cat) { renderHome(); show("home"); }
</script>
</body>
</html>
